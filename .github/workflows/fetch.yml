name: fetch-media
on:
  push:
    paths: ['inbox/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p src/1038
          i=1
          while read -r u; do
            [ -z "$u" ] && continue
            curl -sSL -o "src/1038/p$i.jpg" "$u"
            i=$((i+1))
          done < inbox/urls.txt
          ls -la src/1038
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fotos 1038" || echo nada
          git push
