name: fetch-media
on:
  push:
    paths: ['inbox/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          D=$(cat inbox/dir.txt 2>/dev/null || echo src/1038); mkdir -p $D
          i=1
          while read -r u; do
            [ -z "$u" ] && continue
            curl -sSL -o "$D/p$i.jpg" "$u"
            i=$((i+1))
          done < inbox/urls.txt
          ls -la $D
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fotos de propiedad" || echo nada
          git push
