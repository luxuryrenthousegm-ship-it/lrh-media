name: scrape-alterestate
on:
  push:
    paths: ['inbox/scrape_ae.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/scrape_alterestate.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data
          git commit -m "Catalogo AlterEstate" || echo nada
          git push
