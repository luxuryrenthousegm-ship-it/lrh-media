name: voice-search
on:
  push:
    paths: ['inbox/voice_search.json']
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search ElevenLabs shared voices (and optionally add one)
        env:
          XI: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          key = os.environ["XI"]
          def call(url, data=None, method=None):
              req = urllib.request.Request(url, data=data, method=method, headers={"xi-api-key": key, "Content-Type": "application/json"})
              return json.loads(urllib.request.urlopen(req, timeout=120).read())
          job = json.load(open("inbox/voice_search.json"))
          out = {}
          for q in job.get("queries", []):
              url = "https://api.elevenlabs.io/v1/shared-voices?" + urllib.parse.urlencode(q)
              try:
                  r = call(url)
                  out[json.dumps(q)] = [{k: v.get(k) for k in ("name","voice_id","public_owner_id","gender","age","accent","language","locale","descriptive","use_case","description","cloned_by_count","usage_character_count_1y","preview_url")} for v in r.get("voices", [])]
              except Exception as e:
                  out[json.dumps(q)] = str(e) + " " + getattr(e, "read", lambda: b"")().decode(errors="ignore")[:300]
          if job.get("add"):
              a = job["add"]
              try:
                  out["added"] = call(f"https://api.elevenlabs.io/v1/voices/add/{a['public_owner_id']}/{a['voice_id']}", json.dumps({"new_name": a.get("new_name", "LRH Narradora")}).encode(), "POST")
              except Exception as e:
                  out["added"] = str(e) + " " + getattr(e, "read", lambda: b"")().decode(errors="ignore")[:300]
          os.makedirs("audio", exist_ok=True)
          json.dump(out, open("audio/voice_search.json", "w"), indent=1, ensure_ascii=False)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add audio
          git commit -m "Voice search" || echo nada
          git pull --rebase -q; git push
