name: tts
on:
  push:
    paths: ['inbox/tts.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          XI: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = os.environ["XI"]
          def call(url, data=None):
              req = urllib.request.Request(url, data=data, headers={"xi-api-key": key, "Content-Type": "application/json"})
              return urllib.request.urlopen(req, timeout=120).read()
          os.makedirs("audio", exist_ok=True)
          voices = json.loads(call("https://api.elevenlabs.io/v1/voices"))["voices"]
          mine = [{"name": v["name"], "voice_id": v["voice_id"], "category": v.get("category")} for v in voices if v.get("category") in ("cloned", "professional")]
          json.dump(mine, open("audio/voices.json", "w"), indent=1, ensure_ascii=False)
          jobs = json.load(open("inbox/tts.json"))
          if isinstance(jobs, dict): jobs = [jobs]
          for job in jobs:
              vid = job.get("voice_id") or (mine[0]["voice_id"] if mine else None)
              if not vid: raise SystemExit("no cloned voice found")
              body = json.dumps({"text": job["text"], "model_id": job.get("model_id", "eleven_multilingual_v2"),
                                 "voice_settings": job.get("voice_settings", {"stability": 0.5, "similarity_boost": 0.8, "style": 0.2, "use_speaker_boost": True})}).encode()
              try:
                  mp3 = call(f"https://api.elevenlabs.io/v1/text-to-speech/{vid}?output_format=mp3_44100_128", body)
                  open(f"audio/{job['name']}.mp3", "wb").write(mp3)
              except Exception as e:
                  open(f"audio/{job['name']}.error.txt", "w").write(str(e) + " " + getattr(e, "read", lambda: b"")().decode(errors="ignore")[:500])
          print("ok", [m["name"] for m in mine])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add audio
          git commit -m "Audio TTS" || echo nada
          git push
